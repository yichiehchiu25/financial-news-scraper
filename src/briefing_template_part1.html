<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Intelligence Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#f9f8f5;--surface2:#f3f0ec;--border:#dcd9d5;
  --text:#28251d;--muted:#7a7974;--faint:#bab9b4;
  --primary:#01696f;--primary-hl:#cedcd8;
  --immediate:#a12c7b;--developing:#d19900;--background-c:#437a22;
  --t1:#01696f;--t2:#006494;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --r:8px;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
[data-theme="dark"]{
  --bg:#171614;--surface:#1c1b19;--surface2:#22211f;--border:#393836;
  --text:#cdccca;--muted:#797876;--faint:#5a5957;
  --primary:#4f98a3;--primary-hl:#313b3b;
  --immediate:#d163a7;--developing:#e8af34;--background-c:#6daa45;
  --t1:#4f98a3;--t2:#5591c7;
  --shadow:0 2px 8px rgba(0,0,0,0.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100dvh}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}

/* ── LAYOUT ── */
.app{display:grid;grid-template-rows:auto 1fr;min-height:100dvh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-0.02em}
.logo svg{color:var(--primary)}
.header-right{display:flex;align-items:center;gap:8px}
.main{display:grid;grid-template-columns:240px 1fr;height:calc(100dvh - 53px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
.content{overflow-y:auto;padding:20px}

/* ── SIDEBAR ── */
.sidebar-section{padding:6px 12px 2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);margin-top:8px}
.sidebar-item{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;cursor:pointer;border-radius:0;transition:background 150ms;gap:8px;text-decoration:none;color:var(--text);font-size:13px}
.sidebar-item:hover{background:var(--surface2)}
.sidebar-item.active{background:var(--primary-hl);color:var(--primary);font-weight:600}
.sidebar-item.active .item-icon{color:var(--primary)}
.item-left{display:flex;align-items:center;gap:8px}
.item-icon{color:var(--muted);flex-shrink:0}
.badge{font-size:11px;font-family:var(--font-mono);background:var(--surface2);color:var(--muted);padding:1px 6px;border-radius:999px;border:1px solid var(--border);min-width:24px;text-align:center}
.sidebar-item.active .badge{background:var(--primary);color:white;border-color:var(--primary)}

/* ── STATS BAR ── */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-number{font-size:26px;font-weight:700;letter-spacing:-0.03em;color:var(--primary);font-family:var(--font-mono)}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.stat-delta{font-size:11px;color:var(--faint);font-family:var(--font-mono)}

/* ── SECTION HEADER ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.section-count{font-size:12px;color:var(--muted);font-family:var(--font-mono)}

/* ── ARTICLE CARDS ── */
.articles-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.article-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:box-shadow 150ms,border-color 150ms;position:relative;overflow:hidden}
.article-card:hover{box-shadow:var(--shadow);border-color:var(--primary)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.card-title{font-size:13px;font-weight:500;line-height:1.4;flex:1;text-decoration:none;color:var(--text)}
.card-title:hover{color:var(--primary)}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.source-badge{font-size:11px;font-family:var(--font-mono);font-weight:600;padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.tier1{color:var(--t1);border-color:var(--t1);background:color-mix(in oklch,var(--t1) 8%,var(--surface2))}
.tier2{color:var(--t2);border-color:var(--t2);background:color-mix(in oklch,var(--t2) 8%,var(--surface2))}
.urgency-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:0.05em}
.urgency-Immediate{background:color-mix(in oklch,var(--immediate) 15%,var(--surface));color:var(--immediate)}
.urgency-Developing{background:color-mix(in oklch,var(--developing) 15%,var(--surface));color:var(--developing)}
.urgency-Background{background:color-mix(in oklch,var(--background-c) 12%,var(--surface));color:var(--background-c)}
.card-scores{display:flex;align-items:center;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.score-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.score-bar{width:40px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;background:var(--primary);transition:width 300ms}
.score-num{font-family:var(--font-mono);font-size:11px;color:var(--primary);min-width:28px}
.card-snippet{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entity-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.entity-tag{font-size:10px;font-family:var(--font-mono);background:var(--surface2);border:1px solid var(--border);color:var(--faint);padding:1px 5px;border-radius:3px}

/* ── PIPELINE PANEL ── */
.pipeline-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:20px}
.pipeline-steps{display:flex;gap:0;margin-top:12px}
.pipeline-step{flex:1;text-align:center;position:relative}
.pipeline-step:not(:last-child)::after{content:'';position:absolute;top:16px;right:-1px;width:2px;height:2px;background:var(--border)}
.step-circle{width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0 auto 6px;font-family:var(--font-mono)}
.step-label{font-size:11px;color:var(--muted);line-height:1.3}
.step-count{font-size:13px;font-weight:700;color:var(--text);font-family:var(--font-mono)}
.arrow-sep{display:flex;align-items:center;color:var(--faint);padding-top:0;font-size:18px;margin-top:6px}

/* ── URGENCY CHART ── */
.mini-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.mini-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.mini-chart-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{font-size:12px;color:var(--text);min-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width 600ms cubic-bezier(0.16,1,0.3,1)}
.bar-val{font-size:11px;font-family:var(--font-mono);color:var(--muted);min-width:22px;text-align:right}

/* ── THEME TOGGLE ── */
.theme-toggle{padding:6px;border-radius:6px;color:var(--muted);transition:background 150ms}
.theme-toggle:hover{background:var(--surface2);color:var(--text)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all 150ms}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:white}

/* ── EMPTY ── */
.empty{padding:40px;text-align:center;color:var(--faint);font-size:13px}

@media(max-width:768px){
  .main{grid-template-columns:1fr}
  .sidebar{display:none}
  .stats-bar{grid-template-columns:1fr 1fr}
  .mini-charts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
    News Intelligence
    <span style="font-size:11px;font-weight:400;color:var(--muted);font-family:var(--font-mono);margin-left:4px">v1 · Rule-Based</span>
  </div>
  <div class="header-right">
    <span id="run-time" style="font-size:11px;color:var(--faint);font-family:var(--font-mono)"></span>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<div class="main">
<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-section">Views</div>
  <a class="sidebar-item active" data-view="overview" href="#">
    <div class="item-left"><i class="item-icon" data-lucide="layout-dashboard" style="width:15px;height:15px"></i> Overview</div>
  </a>
  <a class="sidebar-item" data-view="feed" href="#">
    <div class="item-left"><i class="item-icon" data-lucide="rss" style="width:15px;height:15px"></i> Priority Feed</div>
    <span class="badge" id="badge-feed">—</span>
  </a>
  <div class="sidebar-section" style="margin-top:12px">Event Types</div>
  <div id="sidebar-events"></div>
</nav>

<!-- CONTENT -->
<main class="content" id="main-content">
  <div id="view-overview"></div>
  <div id="view-feed" style="display:none"></div>
  <div id="view-event" style="display:none"></div>
</main>
</div>
</div>

<script>
